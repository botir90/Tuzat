<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Uyim va profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #F6F7F4; font-family: Inter, system-ui, sans-serif; color: #15201E; display: flex; flex-direction: column">
<div style="padding: 28px 20px 0; display: flex; align-items: center; gap: 14px">
<div style="width: 60px; height: 60px; border-radius: 30px; background: #7A5A2E; color: #FFFFFF; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center">B</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; font-weight: 800">Botir</span>
<span style="font-size: 14px; color: #4F5B59">+998 •• ••• •• 45 · Kumush daraja</span></div>
</div>
<div style="padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 20px; font-weight: 800">Uyim</span>
<span style="font-size: 14px; font-weight: 700; color: #0F6B5C">+ Qo'shish</span>
</div>
<div style="padding: 4px 20px 0; font-size: 14px; line-height: 1.4; color: #4F5B59">Uy jihozlaringizni qo'shing, xizmat vaqti kelganda eslatamiz.</div>
<div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
<div style="border-radius: 18px; background: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
<span style="width: 48px; height: 48px; border-radius: 16px; background: {{d.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{d.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 700">{{d.name}}</span>
<span style="font-size: 13px; color: {{d.noteColor}}; font-weight: {{d.noteWeight}}">{{d.note}}</span></span>
<sc-if value="{{d.due}}" hint-placeholder-val="{{false}}">
<a href="NewRequest.dc.html" style="height: 38px; border-radius: 19px; background: #0F6B5C; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; padding: 0 14px; text-decoration: none">Chaqirish</a></sc-if>
</div>
</sc-for>
</div>
<div style="padding: 20px 20px 0">
<div style="border-radius: 18px; background: #E3F1EE; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F6B5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 800; color: #0A4F44">1 ta faol kafolat</span>
<span style="font-size: 13px; color: #24403B">Kran ta'miri · 30-noyabrgacha</span></span>
<span style="font-size: 13px; font-weight: 800; color: #0A4F44">Muammo qaytdi?</span>
</div>
</div>
<div style="padding: 20px 20px 0">
<div style="border-radius: 18px; background: #FFFFFF; padding: 4px 16px">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="6">
<a href="{{m.href}}" style="display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: {{m.border}}; text-decoration: none; color: #15201E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E4B49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{m.label}}</span>
<span style="font-size: 14px; color: #5B6866">{{m.value}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6A3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</div>
</div>
<div style="flex-grow: 1"></div>
<nav style="height: 76px; background: #FFFFFF; border-top: 1px solid #E3E7E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.color}}; font-size: 12px; font-weight: 700">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>

return {

],

tab('Buyurtmalar', 'JobStatus.dc.html', 'M5 4h14v17H5zM9 9h6M9 13h6M9 17h3', false),
tab('Bonuslar', 'Bonus.dc.html', 'M3 8h18v13H3zM3 12h18M12 8v13', false),
tab('Uyim', 'Profile.dc.html', 'M12 8a4 4 0 1 0 0-.01M4 21c1-4 4.5-6 8-6s7 2 8 6', true)
]
};
}
}
</script>
</body>
</html>
