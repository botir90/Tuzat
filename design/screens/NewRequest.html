<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>Buyurtma berish</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0f6b5c;
          }
          a:hover {
            color: #0a4f44;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #f6f7f4;
          font-family: Inter, system-ui, sans-serif;
          color: #15201e;
          display: flex;
          flex-direction: column;
        "
      >
        <div style="padding: 24px 20px 0; display: flex; align-items: center; gap: 12px">
          <a
            href="Home.dc.html"
            aria-label="Orqaga"
            style="
              width: 44px;
              height: 44px;
              border-radius: 22px;
              background: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
            "
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#15201E"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 5l-7 7 7 7"></path></svg
          ></a>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 20px; font-weight: 800">Santexnik</div>
            <div style="font-size: 13px; color: #5b6866">Odatiy narx: 80 000 – 250 000 so'm</div>
          </div>
        </div>
        <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="font-size: 15px; font-weight: 700">1. Muammo nima?</div>
            <div
              style="
                border-radius: 16px;
                background: #ffffff;
                border: 1.5px solid #d5dbd9;
                padding: 14px;
                font-size: 15px;
                line-height: 1.45;
                color: #15201e;
                min-height: 56px;
              "
            >
              Oshxonadagi kran oqyapti, yopilmayapti
            </div>
            <div style="display: flex; gap: 10px">
              <div
                style="
                  width: 72px;
                  height: 72px;
                  border-radius: 14px;
                  background: #cfe3de;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <svg
                  width="28"
                  height="28"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#0F6B5C"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  role="img"
                  aria-label="Yuklangan rasm"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <circle cx="9" cy="10" r="2"></circle>
                  <path d="M21 16l-5-5-8 8"></path>
                </svg>
              </div>
              <button
                aria-label="Rasm qo'shish"
                style="
                  width: 72px;
                  height: 72px;
                  border-radius: 14px;
                  border: 1.5px dashed #9aa6a3;
                  background: transparent;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  gap: 4px;
                  font-family: inherit;
                  font-size: 11px;
                  font-weight: 600;
                  color: #4f5b59;
                "
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#4F5B59"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 8h3l2-3h6l2 3h3v11H4z"></path>
                  <circle cx="12" cy="13" r="3"></circle></svg
                >Rasm
              </button>
              <button
                style="flex-grow: 1; height: 72px; border-radius: 14px; border: none; background: {{primary}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#FFFFFF"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                  <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg
                >Ovoz bilan ayting
              </button>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="font-size: 15px; font-weight: 700">2. Manzil</div>
            <div
              style="
                border-radius: 16px;
                background: #ffffff;
                border: 1.5px solid #d5dbd9;
                padding: 14px;
                display: flex;
                gap: 12px;
                align-items: center;
              "
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0F6B5C"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path>
                <circle cx="12" cy="9.5" r="2.5"></circle>
              </svg>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <div style="font-size: 15px; font-weight: 600">Urganch, Al-Xorazmiy ko'chasi</div>
                <div style="font-size: 13px; color: #5b6866">Mo'ljal: 5-maktab yonida</div>
              </div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="font-size: 15px; font-weight: 700">3. Qachon?</div>
            <div style="display: flex; gap: 8px">
              <button
                style="flex: 1; height: 48px; border-radius: 24px; border: 2px solid {{primary}}; background: #E3F1EE; font-family: inherit; font-size: 15px; font-weight: 700; color: #0F6B5C"
              >
                Hozir
              </button>
              <button
                style="
                  flex: 1;
                  height: 48px;
                  border-radius: 24px;
                  border: 1.5px solid #d5dbd9;
                  background: #ffffff;
                  font-family: inherit;
                  font-size: 15px;
                  font-weight: 600;
                  color: #15201e;
                "
              >
                Bugun
              </button>
              <button
                style="
                  flex: 1;
                  height: 48px;
                  border-radius: 24px;
                  border: 1.5px solid #d5dbd9;
                  background: #ffffff;
                  font-family: inherit;
                  font-size: 15px;
                  font-weight: 600;
                  color: #15201e;
                "
              >
                Vaqt tanlash
              </button>
            </div>
          </div>
        </div>
        <div style="flex-grow: 1"></div>
        <div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px">
          <a
            href="Offers.dc.html"
            style="height: 60px; border-radius: 16px; background: {{primary}}; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none"
            >Ustalarni topish</a
          >
          <div style="font-size: 13px; color: #5b6866; text-align: center">
            Bepul. Usta tanlashni o'zingiz hal qilasiz.
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"primary":{"editor":"color","default":"#0F6B5C","options":["#0F6B5C","#1F5FAE","#6B3FA0","#B4471A"]},"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
      renderVals() {
      return { primary: this.props.primary ?? '#0F6B5C' };
      }
      }
    </script>
  </body>
</html>
