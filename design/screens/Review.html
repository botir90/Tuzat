<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>Ish tugadi: baho va to'lov</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0f6b5c;
          }
          a:hover {
            color: #0a4f44;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 1120px;
          box-sizing: border-box;
          background: #f6f7f4;
          font-family: Inter, system-ui, sans-serif;
          color: #15201e;
          display: flex;
          flex-direction: column;
        "
      >
        <div
          style="
            padding: 40px 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
          "
        >
          <div
            style="
              width: 80px;
              height: 80px;
              border-radius: 40px;
              background: #e3f1ee;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              width="44"
              height="44"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0F6B5C"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12l5 5 9-10"></path>
            </svg>
          </div>
          <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.3px">Ish tugadi!</div>
          <div style="font-size: 15px; color: #4f5b59">Sardor A. · Kran ta'miri</div>
        </div>
        <div style="padding: 20px 20px 0">
          <div
            style="
              border-radius: 20px;
              background: #ffffff;
              padding: 18px;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 14px;
            "
          >
            <div style="font-size: 17px; font-weight: 800">Ustaga baho bering</div>
            <div style="display: flex; gap: 8px" role="radiogroup" aria-label="Baho">
              <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
                <button
                  aria-label="{{s.aria}}"
                  style="
                    width: 52px;
                    height: 52px;
                    border: none;
                    background: transparent;
                    padding: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  "
                >
                  <svg
                    width="44"
                    height="44"
                    viewBox="0 0 24 24"
                    fill="{{s.fill}}"
                    stroke="#C77700"
                    stroke-width="1.2"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"
                    ></path>
                  </svg>
                </button>
              </sc-for>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
              <sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
                <button
                  style="height: 40px; border-radius: 20px; border: {{t.border}}; background: {{t.bg}}; color: {{t.color}}; font-family: inherit; font-size: 14px; font-weight: 700; padding: 0 14px"
                >
                  {{t.label}}
                </button>
              </sc-for>
            </div>
            <label for="comment" style="position: absolute; left: -9999px">Izoh</label>
            <input
              id="comment"
              placeholder="Izoh qoldiring (ixtiyoriy)"
              style="
                width: 100%;
                box-sizing: border-box;
                height: 52px;
                border-radius: 14px;
                border: 1.5px solid #d5dbd9;
                padding: 0 14px;
                font-family: inherit;
                font-size: 15px;
              "
            />
            <button
              style="
                align-self: stretch;
                height: 48px;
                border-radius: 14px;
                border: 1.5px dashed #9aa6a3;
                background: transparent;
                font-family: inherit;
                font-size: 14px;
                font-weight: 700;
                color: #3e4b49;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
              "
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#3E4B49"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 8h3l2-3h6l2 3h3v11H4z"></path>
                <circle cx="12" cy="13" r="3"></circle></svg
              >Tayyor ishning rasmini qo'shing
            </button>
          </div>
        </div>
        <div style="padding: 16px 20px 0">
          <div
            style="
              border-radius: 20px;
              background: #ffffff;
              padding: 18px;
              display: flex;
              flex-direction: column;
              gap: 12px;
            "
          >
            <div style="font-size: 17px; font-weight: 800">To'lov</div>
            <div style="display: flex; justify-content: space-between; font-size: 15px">
              <span style="color: #4f5b59">Ish narxi</span><span>120 000 so'm</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 15px">
              <span style="color: #4f5b59">Chegirma (BIRINCHI)</span
              ><span style="color: #0f6b5c; font-weight: 700">−24 000 so'm</span>
            </div>
            <div style="height: 1px; background: #e3e7e5"></div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-size: 18px;
                font-weight: 800;
              "
            >
              <span>Jami</span><span>96 000 so'm</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{pay}}" as="p" hint-placeholder-count="3">
                <button
                  style="height: 52px; border-radius: 14px; border: {{p.border}}; background: {{p.bg}}; font-family: inherit; font-size: 15px; font-weight: 800; color: {{p.color}}"
                >
                  {{p.label}}
                </button>
              </sc-for>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-radius: 14px;
                background: #fff6de;
                padding: 12px 14px;
              "
            >
              <span style="font-size: 14px; font-weight: 700; color: #5a4210"
                >Ustaga choy puli</span
              >
              <span style="display: flex; gap: 6px">
                <button
                  style="
                    height: 36px;
                    border-radius: 18px;
                    border: 1.5px solid #e5c877;
                    background: #ffffff;
                    font-family: inherit;
                    font-size: 13px;
                    font-weight: 700;
                    color: #5a4210;
                    padding: 0 10px;
                  "
                >
                  5 000
                </button>
                <button
                  style="
                    height: 36px;
                    border-radius: 18px;
                    border: 1.5px solid #e5c877;
                    background: #ffffff;
                    font-family: inherit;
                    font-size: 13px;
                    font-weight: 700;
                    color: #5a4210;
                    padding: 0 10px;
                  "
                >
                  10 000
                </button></span
              >
            </div>
          </div>
        </div>
        <div style="padding: 16px 20px 0">
          <div
            style="
              border-radius: 18px;
              background: #2d2a6e;
              color: #ffffff;
              padding: 14px 16px;
              display: flex;
              align-items: center;
              gap: 12px;
            "
          >
            <svg
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#F2B544"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="8" width="18" height="13" rx="1"></rect>
              <path d="M3 12h18M12 8v13"></path>
            </svg>
            <span style="font-size: 14px; line-height: 1.4; color: #e6e4fa"
              ><b style="color: #ffffff">+4 800 bonus</b> hisobingizga tushadi. Kafolat
              30-noyabrgacha amal qiladi.</span
            >
          </div>
        </div>
        <div style="flex-grow: 1"></div>
        <div style="padding: 0 20px 28px">
          <a
            href="Home.dc.html"
            style="
              height: 60px;
              border-radius: 16px;
              background: #0f6b5c;
              color: #ffffff;
              font-size: 18px;
              font-weight: 800;
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
            "
            >Baholash va to'lash</a
          >
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
      class Component extends DCLogic {
      renderVals() {
      const on = { border: '2px solid #0F6B5C', bg: '#E3F1EE', color: '#0F6B5C' };
      const off = { border: '1.5px solid #D5DBD9', bg: '#FFFFFF', color: '#15201E' };
      return {
      stars: [1, 2, 3, 4, 5].map((n) => ({ aria: n + ' yulduz', fill: '#F2B544' })),
      tags: [
      { label: 'Vaqtida keldi', ...on },
      { label: 'Toza ishladi', ...on },
      { label: 'Muloyim', ...off },
      { label: 'Narxi adolatli', ...on },
      { label: 'Tez tuzatdi', ...off }
      ],
      pay: [
      { label: 'Naqd', ...on },
      { label: 'Click', ...off },
      { label: 'Payme', ...off }
      ]
      };
      }
      }
    </script>
  </body>
</html>
