<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>To'lov</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0f6b5c;
          }
          a:hover {
            color: #0a4f44;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #f6f7f4;
          font-family: Inter, system-ui, sans-serif;
          color: #15201e;
          display: flex;
          flex-direction: column;
        "
      >
        <div style="padding: 24px 20px 0; display: flex; align-items: center; gap: 12px">
          <a
            href="Offers.dc.html"
            aria-label="Orqaga"
            style="
              width: 44px;
              height: 44px;
              border-radius: 22px;
              background: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
            "
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#15201E"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 5l-7 7 7 7"></path></svg
          ></a>
          <div style="font-size: 20px; font-weight: 800">To'lov</div>
        </div>
        <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px">
          <div
            style="
              border-radius: 20px;
              background: #e3f1ee;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 12px;
            "
          >
            <div style="display: flex; gap: 12px; align-items: center">
              <svg
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0F6B5C"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path>
                <rect x="9" y="10.5" width="6" height="5" rx="1"></rect>
                <path d="M10.5 10.5V9a1.5 1.5 0 0 1 3 0v1.5"></path>
              </svg>
              <span style="font-size: 16px; font-weight: 800; color: #0a4f44"
                >Pulingiz xavfsiz</span
              >
            </div>
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
              <div style="display: flex; gap: 12px; align-items: flex-start">
                <span
                  style="
                    width: 26px;
                    height: 26px;
                    border-radius: 13px;
                    background: #0f6b5c;
                    color: #ffffff;
                    font-size: 13px;
                    font-weight: 800;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-shrink: 0;
                  "
                  >{{s.n}}</span
                >
                <span style="font-size: 14px; line-height: 1.4; color: #24403b; padding-top: 3px"
                  >{{s.t}}</span
                >
              </div>
            </sc-for>
          </div>
          <div
            style="
              border-radius: 20px;
              background: #ffffff;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                gap: 10px;
                padding-bottom: 6px;
                border-bottom: 1px solid #e3e7e5;
              "
            >
              <span
                style="
                  width: 36px;
                  height: 36px;
                  border-radius: 18px;
                  background: #3d6e8f;
                  color: #ffffff;
                  font-size: 15px;
                  font-weight: 800;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
                >S</span
              >
              <span style="font-size: 15px; font-weight: 700">Sardor A. · Kran ta'miri</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 15px">
              <span style="color: #4f5b59">Ish haqi</span><span>80 000 so'm</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 15px">
              <span style="color: #4f5b59">Ehtiyot qism (taxminiy)</span><span>40 000 so'm</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 15px">
              <span style="color: #4f5b59">Chegirma</span
              ><span style="color: #0f6b5c; font-weight: 700">−24 000 so'm</span>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-size: 18px;
                font-weight: 800;
                padding-top: 4px;
              "
            >
              <span>Jami</span><span>96 000 so'm</span>
            </div>
          </div>
          <div style="font-size: 15px; font-weight: 700">To'lov usuli</div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
              <button
                style="height: 60px; border-radius: 16px; border: {{m.border}}; background: {{m.bg}}; font-family: inherit; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-align: left"
              >
                <span
                  style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{m.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"
                  ><span
                    style="width: 10px; height: 10px; border-radius: 5px; background: {{m.dot}}"
                  ></span
                ></span>
                <span style="flex-grow: 1; font-size: 16px; font-weight: 700; color: #15201e"
                  >{{m.name}}</span
                >
                <span style="font-size: 12px; font-weight: 700; color: {{m.noteColor}}"
                  >{{m.note}}</span
                >
              </button>
            </sc-for>
          </div>
        </div>
        <div style="flex-grow: 1"></div>
        <div style="padding: 0 20px 28px">
          <a
            href="ConfirmJob.dc.html"
            style="
              height: 60px;
              border-radius: 16px;
              background: #0f6b5c;
              color: #ffffff;
              font-size: 18px;
              font-weight: 800;
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
            "
            >96 000 so'm to'lash</a
          >
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() {
      const on = { border: '2px solid #0F6B5C', bg: '#FFFFFF', ring: '#0F6B5C', dot: '#0F6B5C' };
      const off = { border: '1.5px solid #D5DBD9', bg: '#FFFFFF', ring: '#9AA6A3', dot: 'transparent' };
      return {
      steps: [
      { n: 1, t: 'Siz to\'laysiz, pul ustaga emas, xavfsiz hisobda ushlab turiladi' },
      { n: 2, t: 'Usta ishni bajaradi' },
      { n: 3, t: 'Siz "Ish bajarildi" deb tasdiqlaysiz, shundan keyingina pul ustaga o\'tadi' }
      ],
      methods: [
      { name: 'Click', note: '+5% bonus', noteColor: '#0F6B5C', ...on },
      { name: 'Payme', note: '+5% bonus', noteColor: '#0F6B5C', ...off },
      { name: 'Naqd pul', note: 'Kafolatsiz', noteColor: '#B4471A', ...off }
      ]
      };
      }
      }
    </script>
  </body>
</html>
