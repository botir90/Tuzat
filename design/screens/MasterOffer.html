<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Usta: taklif yuborish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F4; font-family: Inter, system-ui, sans-serif; color: #15201E; display: flex; flex-direction: column">
<div style="padding: 24px 20px 0; display: flex; align-items: center; gap: 12px">
<a href="MasterFeed.dc.html" aria-label="Orqaga" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15201E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="font-size: 20px; font-weight: 800">Taklif yuborish</div>
</div>
<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 20px">
<div style="border-radius: 16px; background: #FFFFFF; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B6866">Kran ta'miri · Urganch · 2,1 km</span>
<span style="font-size: 15px; font-weight: 600">Oshxonadagi kran oqyapti, yopilmayapti</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="price" style="font-size: 15px; font-weight: 700">Narxingiz</label>
<div style="border-radius: 16px; background: #FFFFFF; border: 2px solid #0F6B5C; height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
<input id="price" value="120 000" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 26px; font-weight: 800; color: #15201E; width: 200px">
<span style="font-size: 17px; font-weight: 600; color: #5B6866">so'm</span>
</div>
<span style="font-size: 13px; color: #4F5B59">Odatiy narx: 80 000 – 150 000 so'm</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 700">Qachon yetib borasiz?</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{etas}}" as="e" hint-placeholder-count="4">
<button style="height: 48px; border-radius: 12px; border: {{e.border}}; background: {{e.bg}}; font-family: inherit; font-size: 14px; font-weight: 700; color: {{e.color}}">{{e.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="msg" style="font-size: 15px; font-weight: 700">Mijozga xabar (ixtiyoriy)</label>
<input id="msg" value="Ehtiyot qismlar o'zimda bor" style="height: 52px; border-radius: 14px; border: 1.5px solid #D5DBD9; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #15201E">
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px">
<a href="MasterFeed.dc.html" style="height: 60px; border-radius: 16px; background: #0F6B5C; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Taklifni yuborish</a>
<div style="font-size: 13px; color: #4F5B59; text-align: center">Taklif yuborish bepul. Komissiya faqat bajarilgan ishdan olinadi.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = { border: '2px solid #0F6B5C', bg: '#E3F1EE', color: '#0F6B5C' };
const off = { border: '1.5px solid #D5DBD9', bg: '#FFFFFF', color: '#15201E' };
return {
etas: [
{ label: '15 daq', ...off },
{ label: '30 daq', ...on },
{ label: '1 soat', ...off },
{ label: 'Boshqa', ...off }
]
};
}
}
</script>
</body>
</html>
