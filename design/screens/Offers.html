<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>Takliflar</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0f6b5c;
          }
          a:hover {
            color: #0a4f44;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #f6f7f4;
          font-family: Inter, system-ui, sans-serif;
          color: #15201e;
          display: flex;
          flex-direction: column;
        "
      >
        <div style="padding: 24px 20px 0; display: flex; align-items: center; gap: 12px">
          <a
            href="NewRequest.dc.html"
            aria-label="Orqaga"
            style="
              width: 44px;
              height: 44px;
              border-radius: 22px;
              background: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              text-decoration: none;
            "
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#15201E"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 5l-7 7 7 7"></path></svg
          ></a>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 20px; font-weight: 800">3 ta usta taklif berdi</div>
            <div style="font-size: 13px; color: #5b6866">Yana takliflar kelishi mumkin</div>
          </div>
        </div>
        <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
            <div
              style="
                border-radius: 18px;
                background: #ffffff;
                box-shadow: 0 1px 2px rgba(21, 32, 30, 0.08);
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 14px;
              "
            >
              <div style="display: flex; gap: 12px; align-items: center">
                <div
                  style="width: 52px; height: 52px; border-radius: 26px; background: {{o.avatarBg}}; color: #FFFFFF; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0"
                >
                  {{o.initial}}
                </div>
                <div
                  style="
                    flex-grow: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 4px;
                    min-width: 0;
                  "
                >
                  <div style="display: flex; align-items: center; gap: 6px">
                    <a
                      href="MasterProfile.dc.html"
                      style="font-size: 16px; font-weight: 700; color: #15201e"
                      >{{o.name}}</a
                    >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="#0F6B5C"
                      role="img"
                      aria-label="Tasdiqlangan usta"
                    >
                      <path
                        d="M12 2l2.4 2.2 3.2-.4.9 3.1 2.9 1.5-.9 3.1 1.4 2.9-2.7 1.8-.3 3.2-3.2.3L13.8 22 12 20.3 9.6 22l-1.9-2.6-3.2-.3-.3-3.2-2.7-1.8L2.9 11 2 7.9l2.9-1.5.9-3.1 3.2.4z"
                      ></path>
                      <path
                        d="M8.5 12l2.5 2.5 4.5-5"
                        stroke="#FFFFFF"
                        stroke-width="2"
                        fill="none"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </div>
                  <div
                    style="
                      font-size: 13px;
                      color: #4f5b59;
                      display: flex;
                      align-items: center;
                      gap: 4px;
                    "
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="#C77700"
                      aria-hidden="true"
                    >
                      <path
                        d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"
                      ></path>
                    </svg>
                    <span style="font-weight: 700; color: #15201e">{{o.rating}}</span
                    ><span>· {{o.jobs}} ta ish · {{o.reviews}} ta sharh</span>
                  </div>
                </div>
              </div>
              <div style="display: flex; gap: 8px">
                <div
                  style="
                    flex: 1;
                    border-radius: 12px;
                    background: #f6f7f4;
                    padding: 10px 12px;
                    display: flex;
                    flex-direction: column;
                    gap: 2px;
                  "
                >
                  <span style="font-size: 12px; color: #5b6866">Narx</span
                  ><span style="font-size: 16px; font-weight: 800">{{o.price}}</span>
                </div>
                <div
                  style="
                    flex: 1;
                    border-radius: 12px;
                    background: #f6f7f4;
                    padding: 10px 12px;
                    display: flex;
                    flex-direction: column;
                    gap: 2px;
                  "
                >
                  <span style="font-size: 12px; color: #5b6866">Keladi</span
                  ><span style="font-size: 16px; font-weight: 800">{{o.eta}}</span>
                </div>
              </div>
              <a
                href="Payment.dc.html"
                style="height: 50px; border-radius: 14px; background: {{o.btnBg}}; color: {{o.btnColor}}; border: 1.5px solid #0F6B5C; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box"
                >Shu ustani tanlash</a
              >
            </div>
          </sc-for>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() {
      const first = { btnBg: '#0F6B5C', btnColor: '#FFFFFF' };
      const rest = { btnBg: '#FFFFFF', btnColor: '#0F6B5C' };
      return {
      offers: [
      { name: 'Sardor A.', initial: 'S', avatarBg: '#3D6E8F', rating: '4.9', jobs: 128, reviews: 96, price: '120 000 so\'m', eta: '25 daqiqa', ...first },
      { name: 'Jasur R.', initial: 'J', avatarBg: '#7A5A2E', rating: '4.8', jobs: 64, reviews: 51, price: '100 000 so\'m', eta: '1 soat', ...rest },
      { name: 'Otabek M.', initial: 'O', avatarBg: '#5E4A8C', rating: '4.7', jobs: 37, reviews: 30, price: '150 000 so\'m', eta: '15 daqiqa', ...rest }
      ]
      };
      }
      }
    </script>
  </body>
</html>
