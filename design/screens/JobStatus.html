<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>Usta yo'lda</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0f6b5c;
          }
          a:hover {
            color: #0a4f44;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #f6f7f4;
          font-family: Inter, system-ui, sans-serif;
          color: #15201e;
          display: flex;
          flex-direction: column;
        "
      >
        <div
          style="
            background: #0f6b5c;
            color: #ffffff;
            padding: 32px 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 6px;
          "
        >
          <div style="font-size: 14px; font-weight: 600; color: #cfe8e2">
            Santexnik · Kran ta'miri
          </div>
          <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.4px">Usta yo'lda</div>
          <div style="font-size: 17px; color: #e3f1ee">Taxminan 20 daqiqada yetib keladi</div>
        </div>
        <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
          <div
            style="
              border-radius: 18px;
              background: #ffffff;
              box-shadow: 0 1px 2px rgba(21, 32, 30, 0.08);
              padding: 18px;
              display: flex;
              flex-direction: column;
              gap: 0;
            "
          >
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
              <div style="display: flex; gap: 14px; align-items: stretch">
                <div
                  style="display: flex; flex-direction: column; align-items: center; width: 24px"
                >
                  <div
                    style="width: 24px; height: 24px; border-radius: 12px; background: {{s.dotBg}}; border: 2px solid {{s.dotBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"
                  >
                    <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}"
                      ><svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#FFFFFF"
                        stroke-width="3"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="M5 12l5 5 9-10"></path></svg
                    ></sc-if>
                  </div>
                  <div
                    style="width: 2px; flex-grow: 1; min-height: 18px; background: {{s.line}}"
                  ></div>
                </div>
                <div style="padding-bottom: 14px; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 16px; font-weight: {{s.weight}}; color: {{s.color}}"
                    >{{s.label}}</span
                  >
                  <span style="font-size: 13px; color: #5b6866">{{s.time}}</span>
                </div>
              </div>
            </sc-for>
          </div>
          <div
            style="
              border-radius: 18px;
              background: #ffffff;
              box-shadow: 0 1px 2px rgba(21, 32, 30, 0.08);
              padding: 16px;
              display: flex;
              align-items: center;
              gap: 12px;
            "
          >
            <div
              style="
                width: 52px;
                height: 52px;
                border-radius: 26px;
                background: #3d6e8f;
                color: #ffffff;
                font-size: 20px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              S
            </div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 700">Sardor A.</span>
              <span style="font-size: 13px; color: #4f5b59"
                >Kelishilgan narx: <b style="color: #15201e">120 000 so'm</b></span
              >
            </div>
            <a
              href="Chat.dc.html"
              aria-label="Ustaga yozish"
              style="
                width: 52px;
                height: 52px;
                border-radius: 26px;
                background: #e3f1ee;
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
              "
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0F6B5C"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 5h16v11H9l-5 4z"></path></svg
            ></a>
            <a
              href="Call.dc.html"
              aria-label="Ustaga qo'ng'iroq qilish"
              style="
                width: 52px;
                height: 52px;
                border-radius: 26px;
                background: #0f6b5c;
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
              "
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"
                ></path></svg
            ></a>
          </div>
          <div
            style="
              border-radius: 18px;
              background: #fdf0e6;
              border: 1.5px solid #f2c7a5;
              padding: 16px;
              display: flex;
              flex-direction: column;
              gap: 12px;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 15px; font-weight: 700; color: #6e2e0e"
                >Usta narxni o'zgartirishni so'radi</span
              >
              <span style="font-size: 14px; line-height: 1.4; color: #5a3a26"
                >Yangi narx: <b>150 000 so'm</b>. Sabab: kranning ichki qismini almashtirish
                kerak.</span
              >
            </div>
            <div style="display: flex; gap: 8px">
              <a
                href="Review.dc.html"
                style="
                  flex: 1;
                  height: 48px;
                  border-radius: 12px;
                  background: #0f6b5c;
                  color: #ffffff;
                  font-size: 15px;
                  font-weight: 700;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  text-decoration: none;
                "
                >Roziman</a
              >
              <button
                style="
                  flex: 1;
                  height: 48px;
                  border-radius: 12px;
                  border: 1.5px solid #b9a08c;
                  background: #ffffff;
                  color: #15201e;
                  font-family: inherit;
                  font-size: 15px;
                  font-weight: 700;
                "
              >
                Rad etaman
              </button>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() {
      const done = { done: true, dotBg: '#0F6B5C', dotBorder: '#0F6B5C', line: '#0F6B5C', weight: 600, color: '#15201E' };
      const now = { done: false, dotBg: '#FFFFFF', dotBorder: '#0F6B5C', line: '#D5DBD9', weight: 800, color: '#0F6B5C' };
      const todo = { done: false, dotBg: '#FFFFFF', dotBorder: '#B8C1BE', line: '#D5DBD9', weight: 500, color: '#5B6866' };
      return {
      steps: [
      { label: 'Usta qabul qildi', time: '14:05', ...done },
      { label: 'Usta yo\'lda', time: 'Hozir', ...now },
      { label: 'Ish boshlandi', time: '', ...todo },
      { label: 'Ish tugadi, baho qo\'ying', time: '', ...todo, line: 'transparent' }
      ]
      };
      }
      }
    </script>
  </body>
</html>
