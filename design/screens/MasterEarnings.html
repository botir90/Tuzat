<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>Usta: daromad</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #0f6b5c;
          }
          a:hover {
            color: #0a4f44;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #f6f7f4;
          font-family: Inter, system-ui, sans-serif;
          color: #15201e;
          display: flex;
          flex-direction: column;
        "
      >
        <div style="padding: 32px 20px 0; display: flex; flex-direction: column; gap: 16px">
          <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.3px">Daromad</div>
          <div
            style="
              border-radius: 20px;
              background: #0f6b5c;
              color: #ffffff;
              padding: 20px;
              display: flex;
              flex-direction: column;
              gap: 16px;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 14px; color: #cfe8e2">Shu hafta</span>
              <span style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px"
                >1 240 000 so'm</span
              >
              <span style="font-size: 14px; color: #e3f1ee">9 ta ish bajarildi</span>
            </div>
            <div style="display: flex; align-items: flex-end; gap: 8px; height: 72px">
              <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
                <div
                  style="
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    gap: 6px;
                  "
                >
                  <div
                    style="width: 100%; height: {{b.h}}; border-radius: 6px; background: {{b.bg}}"
                  ></div>
                  <span style="font-size: 11px; font-weight: 600; color: #cfe8e2">{{b.d}}</span>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <div
              style="
                border-radius: 16px;
                background: #ffffff;
                padding: 14px 16px;
                display: flex;
                flex-direction: column;
                gap: 4px;
              "
            >
              <span style="font-size: 13px; color: #5b6866">Shu oy</span>
              <span style="font-size: 18px; font-weight: 800">4 860 000</span>
            </div>
            <div
              style="
                border-radius: 16px;
                background: #ffffff;
                padding: 14px 16px;
                display: flex;
                flex-direction: column;
                gap: 4px;
              "
            >
              <span style="font-size: 13px; color: #5b6866">Reyting</span>
              <span style="font-size: 18px; font-weight: 800">4.9 · 96 sharh</span>
            </div>
          </div>
          <div
            style="
              border-radius: 16px;
              background: #e3f1ee;
              padding: 14px 16px;
              display: flex;
              gap: 12px;
              align-items: center;
            "
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0F6B5C"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              style="flex-shrink: 0"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 8v4M12 16h.01"></path>
            </svg>
            <span style="font-size: 14px; line-height: 1.4; color: #24403b"
              >Dastlabki 3 oy komissiyasiz. Keyin faqat bajarilgan ishdan 5–10%.</span
            >
          </div>
          <div style="font-size: 16px; font-weight: 700; margin-top: 4px">Oxirgi ishlar</div>
          <div
            style="
              border-radius: 16px;
              background: #ffffff;
              padding: 4px 16px;
              display: flex;
              flex-direction: column;
            "
          >
            <sc-for list="{{jobs}}" as="j" hint-placeholder-count="3">
              <div
                style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: {{j.border}}"
              >
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 15px; font-weight: 600">{{j.title}}</span>
                  <span style="font-size: 13px; color: #5b6866">{{j.meta}}</span>
                </div>
                <span style="font-size: 15px; font-weight: 700">{{j.sum}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="flex-grow: 1"></div>
        <nav
          style="
            height: 76px;
            background: #ffffff;
            border-top: 1px solid #e3e7e5;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
          "
        >
          <a
            href="MasterFeed.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              text-decoration: none;
              color: #5b6866;
              font-size: 12px;
              font-weight: 600;
            "
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"></path></svg
            >Buyurtmalar</a
          >
          <a
            href="MasterFeed.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              text-decoration: none;
              color: #5b6866;
              font-size: 12px;
              font-weight: 600;
            "
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"
              ></path></svg
            >Ishlarim</a
          >
          <a
            href="MasterEarnings.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              text-decoration: none;
              color: #0f6b5c;
              font-size: 12px;
              font-weight: 700;
            "
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="6" width="18" height="13" rx="2"></rect>
              <path d="M3 10h18M16 15h2"></path></svg
            >Daromad</a
          >
        </nav>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
      renderVals() {
      const hs = [30, 55, 20, 70, 45, 85, 40];
      const days = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
      return {
      bars: hs.map((h, i) => ({ h: h + '%', d: days[i], bg: i === 5 ? '#FFFFFF' : 'rgba(255,255,255,0.45)' })),
      jobs: [
      { title: 'Kran ta\'miri', meta: 'Bugun · 5 yulduz', sum: '150 000', border: '1px solid #E3E7E5' },
      { title: 'Unitaz bachogi', meta: 'Kecha · 5 yulduz', sum: '120 000', border: '1px solid #E3E7E5' },
      { title: 'Quvur almashtirish', meta: '12-noyabr · 4 yulduz', sum: '300 000', border: 'none' }
      ]
      };
      }
      }
    </script>
  </body>
</html>
