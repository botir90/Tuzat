# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: usta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usta
      POSTGRES_PASSWORD: usta_dev_password
      POSTGRES_DB: usta
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U usta -d usta']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage for photos and voice messages (local development only).
  # Production uses a real S3-compatible service; the code is the same.
  storage:
    image: chrislusf/seaweedfs:3.97
    container_name: usta-storage
    restart: unless-stopped
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json'
    ports:
      - '8333:8333'
    volumes:
      - storage-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  storage-data:
